name: Go package

on:
  push:
    tags:
      - "v*" # push events to tagged commits
    branches:
      - "**"
    paths:
      - ".github/workflows/go.yml"
      - "Makefile"
      - "pkgs/**"
      - "src/**"

permissions:
  contents: read
  id-token: write # for GitHub id-token auth
  actions: read # to query workflow runs for coverage baseline

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Sanitize branch name for artifact
        id: branch
        run: echo "name=$(echo '${{ github.ref_name }}' | tr '/' '-')" >>
          "$GITHUB_OUTPUT"

      - name: Run Go unit tests
        run:
          go test -race -test.short -v -coverprofile=coverage.out -covermode=atomic
          ./...
        working-directory: src
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # to avoid GH rate limits

      - name: Generate coverage summary
        run: |
          grep -v '/src/protos/' coverage.out > coverage.filtered.out
          go tool cover -func=coverage.filtered.out | tee coverage.txt
        working-directory: src

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-${{ steps.branch.outputs.name }}
          path: src/coverage.txt
          overwrite: true

      - name: Find merge-base run ID
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v')
        id: merge-base-run
        continue-on-error: true # no baseline yet on first run
        run: |
          git fetch origin main --depth=50
          MERGE_BASE=$(git merge-base HEAD origin/main)
          echo "Merge base: $MERGE_BASE"
          RUN_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/go.yml/runs" \
            -X GET -f branch=main -f per_page=100 \
            --jq ".workflow_runs[] | select(.head_sha == \"$MERGE_BASE\" and .conclusion == \"success\") | .id" \
            | head -1)
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download merge-base coverage
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') && steps.merge-base-run.outputs.run_id != ''
        uses: dawidd6/action-download-artifact@b6e2e70617bc3265edd6dab6c906732b2f1ae151 # v21
        with:
          workflow: go.yml
          run_id: ${{ steps.merge-base-run.outputs.run_id }}
          name: coverage-main
          path: coverage-main
        continue-on-error: true # artifact may have expired

      - name: Verify Go modules
        working-directory: src
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || { echo "Go modules are not up to date"; exit 1; }

      - name: Install protoc and plugins
        working-directory: src
        run: |
          PROTOC_VERSION=32.1
          curl -fsSL "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip" -o protoc.zip
          sudo unzip -o protoc.zip -d /usr/local bin/protoc 'include/*'
          rm protoc.zip
          # Pin the generators to the versions this module already builds against.
          # With @latest, "Verify Proto files" breaks on every upstream release: the
          # regenerated files carry the new generator version in their header
          # comment while the committed ones carry go.mod's.
          go install "google.golang.org/protobuf/cmd/protoc-gen-go@$(go list -m -f '{{.Version}}' google.golang.org/protobuf)"
          go install "connectrpc.com/connect/cmd/protoc-gen-connect-go@$(go list -m -f '{{.Version}}' connectrpc.com/connect)"

      - name: Verify Proto files
        working-directory: src
        run: |
          touch protos/io/defang/v1/fabric.proto protos/google/type/money.proto
          make protos
          git diff --exit-code protos || { echo "Proto files are not up to date"; exit 1; }

      - name: Build MacOS binary
        run: GOOS=darwin go build ./cmd/cli
        working-directory: src

      - name: Build Windows binary
        run: GOOS=windows go build ./cmd/cli
        working-directory: src

      - name: Check coverage regression
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') && github.actor != 'dependabot[bot]'
        run: |
          if [ ! -f coverage-main/coverage.txt ]; then
            echo "No main coverage baseline found, skipping comparison"
            exit 0
          fi
          main_pct=$(grep '^total:' coverage-main/coverage.txt | awk '{print $3}' | tr -d '%')
          curr_pct=$(grep '^total:' src/coverage.txt | awk '{print $3}' | tr -d '%')
          if [ -z "$main_pct" ] || [ -z "$curr_pct" ]; then
            echo "ERROR: Could not parse coverage percentages (main='$main_pct', current='$curr_pct')"
            exit 1
          fi
          echo "Main: ${main_pct}%  Current branch: ${curr_pct}%"
          if awk "BEGIN { exit !(${curr_pct} < ${main_pct}) }"; then
            echo "ERROR: Coverage decreased from ${main_pct}% to ${curr_pct}%"
            exit 1
          fi
          echo "Coverage OK (${curr_pct}% >= ${main_pct}%)"

      # Sanity-check the GitHub OIDC login flow against Fabric on every push;
      # moved here from the retired go-playground-test job.
      - name: Login using GitHub token
        run: go run -race ./cmd/cli login --debug
        working-directory: src

  nix-shell-test:
    runs-on: ubuntu-latest
    needs: go-test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Check nix-shell default.nix
        id: nix-test
        continue-on-error: true
        run: |
          set -o pipefail
          make test-nix 2>&1 | tee /tmp/nix-test-output.log
          exit "${PIPESTATUS[0]}"

      - name: Update vendorHash if needed
        if: steps.nix-test.outcome == 'failure'
        run: |
          # Extract the correct hash from the error output
          NEW_HASH=$(grep 'got:' /tmp/nix-test-output.log | grep -oP 'sha256-[A-Za-z0-9+/]+=*' | head -1)

          if [ -n "$NEW_HASH" ]; then
            # Validate hash format (should be sha256- followed by 44 base64 characters)
            if ! echo "$NEW_HASH" | grep -qE '^sha256-[A-Za-z0-9+/]{43}=$'; then
              echo "❌ Extracted hash has invalid format: $NEW_HASH"
              exit 1
            fi

            echo "Found new hash: $NEW_HASH"

            # Update the vendorHash in cli.nix
            OLD_HASH=$(grep -oP 'vendorHash = "\Ksha256-[A-Za-z0-9+/]+=*' pkgs/defang/cli.nix)
            echo "Old hash: $OLD_HASH"

            # Use @ as delimiter since it won't appear in base64 hashes
            sed -i "s@vendorHash = \"$OLD_HASH\"@vendorHash = \"$NEW_HASH\"@" pkgs/defang/cli.nix

            # Verify the fix works before committing
            echo "Verifying the updated hash..."
            if make test-nix; then
              echo "✅ Verification successful"

              # Configure git
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"

              # Commit and push the change
              git add pkgs/defang/cli.nix
              git commit -m "Update Nix vendorHash to $NEW_HASH"
              git push

              echo "✅ Updated vendorHash and committed the change"
            else
              echo "❌ Verification failed after updating hash"
              exit 1
            fi
          else
            echo "❌ Could not extract hash from error output"
            echo "Last 20 lines of output:"
            tail -20 /tmp/nix-test-output.log
            exit 1
          fi

  # Replaces the retired go-playground-test job: the Playground was discontinued,
  # so config/up/down sanity tests now run as BYOC smoketests (AWS + GCP) in
  # DefangLabs/defang-mvp, built from this exact commit. The public CLI repo has
  # no cloud credentials, hence the cross-repo workflow dispatch.
  trigger-smoketests:
    name: Trigger CLI smoketests (BYOC)
    runs-on: ubuntu-latest
    needs: go-test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    concurrency:
      group: smoketests-${{ github.ref }}
      cancel-in-progress: false
    environment: smoketest
    timeout-minutes: 45
    steps:
      - name: Trigger smoketests and await conclusion
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          # If this token is expired, you can regenerate by following these steps:
          # 1. Navigate to https://github.com/settings/personal-access-tokens/new
          # 2. Fill out the form with the following values:
          #   * Token name: defang-mvp-workflow-dispatch-token
          #   * Description: This token will be used by a workflow in the `DefangLabs/defang` repository to trigger a workflow run in the `DefangLabs/defang-mvp` repository.
          #   * Resource Owner: Defang Labs
          #   * Expiration: 366 days
          #   * Repositories:
          #     * DefangLabs/defang-mvp
          #   * Repository Permissions:
          #     * Actions (read and write access)
          #     * Metadata (read only)
          # 3. Click "Generate token"
          # 4. Copy the new token into the `DEFANG_MVP_ACTIONS_DISPATCH_TOKEN` secret in the `smoketest` environment
          github-token: ${{ secrets.DEFANG_MVP_ACTIONS_DISPATCH_TOKEN }}
          script: |
            const owner = 'DefangLabs';
            const repo = 'defang-mvp';
            const workflow_id = 'cli-smoketests.yml';
            const cliVersion = context.sha; // build the CLI from the exact commit under test

            // Remember the newest existing run: createWorkflowDispatch does not
            // return the new run's id, so we find ours by id > watermark plus the
            // CLI version in the run name (see run-name in cli-smoketests.yml).
            const { data: before } = await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id, per_page: 1 });
            const watermark = before.workflow_runs[0]?.id ?? 0;

            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id, ref: 'main',
              inputs: { 'sample-name': 'html-css-js', 'cli-version': cliVersion },
            });

            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            let run;
            for (let i = 0; i < 30 && !run; i++) {
              await sleep(10_000);
              const { data } = await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id, event: 'workflow_dispatch', per_page: 30 });
              run = data.workflow_runs.find((wr) => wr.id > watermark && wr.name.includes(cliVersion));
            }
            if (!run) {
              throw new Error('Timed out waiting for the dispatched smoketest run to appear');
            }
            core.notice(`Awaiting smoketests: ${run.html_url}`);

            while (run.status !== 'completed') {
              await sleep(30_000);
              run = (await github.rest.actions.getWorkflowRun({ owner, repo, run_id: run.id })).data;
            }
            if (run.conclusion !== 'success') {
              throw new Error(`Smoketests concluded '${run.conclusion}': ${run.html_url}`);
            }
            core.notice(`Smoketests passed: ${run.html_url}`);

  # Publish the Nix binary cache for this tag, so `nix run github:DefangLabs/defang`
  # downloads the CLI instead of compiling it. Cachix owns storage, signing, and the
  # substituter protocol, so this pushes straight from CI with no cloud credentials
  # and no second repo — unlike trigger-smoketests above, which has to dispatch into
  # DefangLabs/defang-mvp because that's where the cloud credentials live.
  publish-nix-cache:
    name: Publish Nix binary cache (${{ matrix.system }})
    runs-on: ${{ matrix.runs-on }}
    needs: nix-shell-test # cache the derivation that job just proved builds
    if: startsWith(github.ref, 'refs/tags/v') # only released versions are cached
    environment: release # for CACHIX_AUTH_TOKEN
    strategy:
      fail-fast: false # a broken macOS runner should not withhold the Linux cache
      matrix:
        include:
          - system: x86_64-linux
            runs-on: ubuntu-latest
          - system: aarch64-darwin
            runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Set up Cachix
        uses: cachix/cachix-action@02b16339eddcf6ea27126a830c7f1992855cae13 # v17
        with:
          # Public cache; public key is committed in flake.nix and the README.
          name: defanglabs
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build and push defang-cli
        # cachix-action installs a post-build hook above, so this push is
        # automatic: every output the build realises gets signed and uploaded.
        run: nix build .#defang-cli --print-out-paths

  build-and-sign:
    name: Build app and sign files (with Trusted Signing)
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' # only run this step on tagged commits or the main branch
    environment: release # must use environment to be able to authenticate with Azure Federated Identity for Trusted Signing
    needs: go-test
    runs-on: windows-latest
    env:
      # from https://github.com/spiffe/spire/pull/5158
      GOPATH: "D:\\golang\\go"
      GOCACHE: "D:\\golang\\cache"
      GOMODCACHE: "D:\\golang\\modcache"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Download Go dependencies
        run: go mod download
        working-directory: src

      - name: Install GoReleaser Pro
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser-pro
          install-only: true
        env:
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}

      - name: Run GoReleaser (Linux)
        run:
          goreleaser release --split ${{ !startsWith(github.ref, 'refs/tags/v') &&
          '--snapshot' || '' }} ${{ github.event_name == 'schedule' &&
          '--nightly' || ''}}
        working-directory: src
        env:
          GGOOS: linux
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}

      - name: Run GoReleaser (Windows)
        run:
          goreleaser release --split ${{ !startsWith(github.ref, 'refs/tags/v') &&
          '--snapshot' || '' }} ${{ github.event_name == 'schedule' &&
          '--nightly' || ''}}
        working-directory: src
        env:
          GGOOS: windows
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}

      # From https://github.com/Azure/trusted-signing-action/pull/37
      - name: Azure login
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Trusted Signing
        uses: Azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: https://wus2.codesigning.azure.net/ # from Azure portal
          trusted-signing-account-name: DefangLabs # from Azure portal
          certificate-profile-name: signed-binary${{ !startsWith(github.ref,
            'refs/tags/v') && '-test' || '' }} # from Azure portal
          files-folder: ${{ github.workspace }}\src\dist
          files-folder-filter: exe # no dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Update archives
        if: startsWith(github.ref, 'refs/tags/v') # skip this step for snapshots because we don't know the name of the archive
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          # the prefix "defang-win" should match the id in the build section of .goreleaser.yml
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          Compress-Archive -Path defang-win_windows_amd64_v1\* -DestinationPath "defang_${version}_windows_amd64.zip" -Update
          Compress-Archive -Path defang-win_windows_arm64*\* -DestinationPath "defang_${version}_windows_arm64.zip" -Update
        shell: pwsh
        working-directory: src\dist\windows

      - name: Upload dist-win folder
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-win
          path: src/dist
          if-no-files-found: error

  build-and-sign-mac:
    name: Build app and sign (MacOS)
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' # only run this step on tagged commits or the main branch
    environment: release
    needs: go-test
    runs-on: macos-latest # for codesign and notarytool
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      # - name: Download Go dependencies
      #   run: go mod download
      #   working-directory: src

      - name: Run GoReleaser (macOS)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser-pro # either 'goreleaser' (default) or 'goreleaser-pro'
          # version: latest
          args:
            release --split ${{ !startsWith(github.ref, 'refs/tags/v') && '--snapshot'
            || '' }} ${{ github.event_name == 'schedule' && '--nightly' || ''}}
          workdir: src
        env:
          GGOOS: darwin
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          MACOS_CERTIFICATE_NAME: ${{ secrets.MACOS_CERTIFICATE_NAME }}
          MACOS_P12_BASE64: ${{ secrets.MACOS_P12_BASE64 }}
          MACOS_P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
          MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
          MACOS_NOTARIZATION_APP_PW: ${{ secrets.MACOS_NOTARIZATION_APP_PW }}

      - name: Upload dist-mac folder
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-mac
          path: src/dist
          if-no-files-found: error

  go-release:
    if: startsWith(github.ref, 'refs/tags/v') # only run this step on tagged commits
    environment: release
    needs:
      - build-and-sign-mac
      - build-and-sign
      - trigger-smoketests
    runs-on: ubuntu-latest
    permissions:
      contents: write # to upload archives as GitHub Releases
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # for release notes

      - name: Install Nix (for nix-prefetch-url)
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31

      - name: Download dist-mac folder
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist-mac
          path: src/dist

      - name: Download dist-win folder
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist-win
          path: src/dist

      - name: List files
        run: ls -lR src/dist

      - name: Set up Go # not sure why this is needed for release
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser-pro # either 'goreleaser' (default) or 'goreleaser-pro'
          # version: latest
          args: continue --merge
          workdir: src
        env:
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          GH_PAT_WINGET: ${{ secrets.GH_PAT_WINGET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GITHUB_TOKEN is limited to the current repository
          DISCORD_WEBHOOK_ID: ${{ secrets.DISCORD_WEBHOOK_ID }}
          DISCORD_WEBHOOK_TOKEN: ${{ secrets.DISCORD_WEBHOOK_TOKEN }}
          # Make sure this "GH_PAT_WINGET" is still valid and is a Github PAT (Classic) with repo permissions
          # https://github.com/orgs/community/discussions/106661

  push-docker:
    runs-on: ubuntu-latest
    environment: release
    needs:
      - go-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Build and push Docker images and manifests
        working-directory: src
        run: make push-images ${{ startsWith(github.ref, 'refs/tags/v') &&
          format('VERSION={0}', github.ref_name) || '' }}
  post-release:
    runs-on: ubuntu-latest
    needs: go-release
    environment: release
    steps:
      - name: Trigger CLI Autodoc
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          token: ${{ secrets.DOCS_ACTION_TRIGGER_TOKEN }}
          repository: DefangLabs/defang-docs
          event-type: cli-autodoc
          client-payload: '{"version": "${{ github.ref_name }}"}'

      - name: Trigger Homebrew Formula Update
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          token: ${{ secrets.HOMEBREW_ACTION_TRIGGER_TOKEN }}
          repository: DefangLabs/homebrew-defang
          event-type: update-homebrew-formula
          client-payload: '{"version": "${{ github.ref_name }}"}'

      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build npm package
        uses: ./.github/actions/npm-build
        with:
          registry-url: https://registry.npmjs.org
          version: ${{ github.ref_name }}

      - run: npm publish --access public
        shell: bash
        working-directory: ./pkgs/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

  on-failure:
    runs-on: ubuntu-latest
    if: failure() && (github.ref == 'refs/heads/main' || startsWith(github.ref,
      'refs/tags/v'))
    needs:
      [go-release, post-release, nix-shell-test, push-docker, publish-nix-cache]
    steps:
      - name: Slack Notification
        uses: rtCamp/action-slack-notify@33ca3be66c6f378fe1610fd1d5258632dbed5e58 # v2
        env:
          MSG_MINIMAL: actions url
          SLACK_COLOR: failure
          SLACK_FOOTER: ""
          SLACK_MESSAGE: ""
          SLACK_TITLE: Defang CLI workflow failed
          SLACK_WEBHOOK: ${{ secrets.SLACK_NOTIFIER_WEBHOOK_URL }}
